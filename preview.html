<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="티맵모빌리티 U.STRA HR 디자인 목업 — 가상 데이터, 서버 미연계">
    <title>TMAP MOBILITY · U.STRA HR</title>
    <!-- 스타일: 디자인 토큰 → 공통 컴포넌트 → 화면별 스타일 → 반응형 순서 -->
    <style>
/* ======================================================================
   TMAP × U.STRA HR / 고객 테마 제안 v0.3
   코드 안내: 01 토큰 / 02 셸 / 03 공통 / 04 홈 / 05 업무 / 06 반응형
   고객 테마는 표현만 변경합니다. 계산·권한·워크플로우와 분리합니다.
   ====================================================================== */

/* 01. DESIGN TOKENS — 색상·간격·크기 수정의 시작점 */
:root {
    --color-primary: #1959ed;
    --color-violet: #8051ff;
    --color-cyan: #43cbd7;
    --color-text: #17191e;
    --color-muted: #667080;
    --color-line: #e2e5eb;
    --color-surface: #fff;
    --color-soft: #f6f8fb;
    --color-selected: #efedff;
    --color-success: #087765;
    --color-error: #b42332;
    --radius-card: 18px;
    --radius-control: 9px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 40px;
    --header-height: 80px;
    --sidebar-width: 224px;
    --font-body: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
    --shadow-dialog: 0 24px 80px #16264a24;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--color-surface); color: var(--color-text); font: 14px/1.6 var(--font-body); }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button, a { touch-action: manipulation; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 3px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 30px; letter-spacing: -1.2px; line-height: 1.35; }
h2 { font-size: 23px; letter-spacing: -.8px; line-height: 1.5; }
h3 { font-size: 18px; letter-spacing: -.5px; }
svg { width: 21px; height: 21px; flex-shrink: 0; vertical-align: middle; }
.skip-link { position: fixed; left: 16px; top: -90px; z-index: 30; padding: 12px; background: white; }
.skip-link:focus { top: 10px; }

/* 02. APPLICATION SHELL — 헤더, LNB, 메인 컨테이너 */
.header { height: var(--header-height); border-bottom: 1px solid var(--color-line); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-6); position: sticky; top: 0; background: white; z-index: 10; gap: 20px; }
.brand { display: flex; align-items: center; gap: 22px; white-space: nowrap; }
.brand img { width: 211px; height: auto; display: block; }
.brand-divider { height: 24px; width: 1px; background: #c9ced8; }
.product-name { font-size: 23px; font-weight: 650; color: #52555c; }
.utilities { display: flex; align-items: center; gap: 18px; }
.prototype-tag { font-size: 11px; color: var(--color-muted); background: var(--color-soft); padding: 3px 9px; border-radius: 20px; }
.icon-button { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 0; background: transparent; border-radius: var(--radius-control); color: inherit; }
.icon-button:hover { background: var(--color-soft); }
.avatar { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--color-line); display: inline-grid; place-items: center; font-size: 11px; color: var(--color-muted); }
.user-label { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.sidebar { position: fixed; top: var(--header-height); bottom: 0; width: var(--sidebar-width); border-right: 1px solid var(--color-line); padding: 32px 18px 20px; display: flex; flex-direction: column; background: white; z-index: 9; overflow-y: auto; }
.nav-link { display: flex; gap: 13px; align-items: center; padding: 12px 16px; border-radius: var(--radius-control); margin-bottom: 5px; position: relative; font-size: 15px; white-space: nowrap; }
.nav-link:hover { background: var(--color-soft); }
.nav-link.active { background: var(--color-selected); color: #2d34df; font-weight: 650; }
.nav-link.active::before { content: ''; position: absolute; left: 0; height: 22px; width: 3px; background: var(--color-primary); border-radius: 2px; }
.nav-link.settings { margin-top: 28px; border-top: 1px solid var(--color-line); border-radius: 0; padding-top: 24px; }
.sidebar-footer { margin-top: auto; padding: 32px 9px 0; font-size: 10px; color: var(--color-muted); white-space: nowrap; }
.demo-dot { display: inline-block; width: 6px; height: 6px; background: var(--color-primary); border-radius: 50%; margin-right: 5px; }
.main { margin-left: var(--sidebar-width); padding: 36px 36px 24px; min-height: calc(100vh - var(--header-height)); }
.mobile-menu { display: none; }

/* 03. COMMON COMPONENTS — 모든 업무화면에서 재사용 */
.page-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
.breadcrumb { color: var(--color-muted); font-size: 12px; margin-bottom: 8px; }
.subtitle { color: var(--color-muted); margin-top: 8px; font-size: 13px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 9px 16px; min-height: 40px; border: 1px solid #cfd4dd; border-radius: var(--radius-control); background: white; color: var(--color-text); white-space: nowrap; }
.button:hover { background: var(--color-soft); }
.button.primary { background: var(--color-primary); color: white; border-color: var(--color-primary); }
.button.primary:hover { background: #144bd0; }
.button.danger { color: var(--color-error); }
.text-button { color: var(--color-primary); background: none; border: 0; padding: 5px 2px; white-space: nowrap; }
.text-button:hover { text-decoration: underline; }
.actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.notice { border-radius: var(--radius-control); padding: 12px 16px; display: flex; gap: 10px; font-size: 12px; color: #586375; background: var(--color-soft); margin-bottom: 24px; }
.notice svg { width: 17px; height: 17px; margin-top: 1px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.section-heading .label { color: var(--color-muted); font-size: 12px; font-weight: 400; margin-left: 12px; letter-spacing: 0; }
.panel { border: 1px solid var(--color-line); border-radius: var(--radius-card); padding: 24px; background: white; }
.panel + .panel { margin-top: 24px; }
.filters { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; padding: 20px; background: var(--color-soft); border-radius: 12px; margin-bottom: 24px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 130px; }
.field.grow { flex: 1; }
label { font-size: 12px; color: #4e5868; }
input, select, textarea { background: white; border: 1px solid #cfd4dd; border-radius: 7px; padding: 9px 11px; min-height: 40px; color: var(--color-text); width: 100%; }
textarea { min-height: 100px; resize: vertical; }
.table-wrap { overflow: auto; }
table { border-collapse: collapse; width: 100%; text-align: left; font-size: 13px; white-space: nowrap; }
th { background: #f2f4f8; font-size: 12px; color: #545f70; font-weight: 600; padding: 13px 18px; }
td { padding: 14px 18px; border-bottom: 1px solid var(--color-line); }
tr:last-child td { border-bottom-color: transparent; }
tbody tr:hover { background: #fafbff; }
.numeric { text-align: right; font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; border: 1px solid #dedbff; color: #4244ce; background: #f2f0ff; border-radius: 20px; padding: 3px 11px; display: inline-block; white-space: nowrap; }
.badge.neutral { color: #586375; background: #f7f8fa; border-color: #e1e4e9; }
.badge.success { color: var(--color-success); background: #edf8f3; border-color: #d2ece1; }
.badge.error { color: var(--color-error); background: #fff0f1; border-color: #ffd4d9; }
.empty { text-align: center; padding: 50px 20px; color: var(--color-muted); white-space: normal; }
.page-footer { font-size: 11px; color: #7b8390; margin-top: 22px; }
.tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.tabs button { padding: 8px 17px; background: white; border: 1px solid var(--color-line); border-radius: 8px; color: #4a5463; }
.tabs button[aria-pressed="true"] { background: var(--color-primary); border-color: var(--color-primary); color: white; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 24px; }
.detail-list { margin: 0; }
.detail-list div { display: grid; grid-template-columns: 95px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-line); }
.detail-list dt { color: var(--color-muted); font-size: 12px; }
.detail-list dd { margin: 0; overflow-wrap: anywhere; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 24px; }
.form-grid .full { grid-column: 1 / -1; }
dialog { border: 1px solid var(--color-line); border-radius: 18px; padding: 28px; width: min(650px, calc(100% - 32px)); max-height: calc(100vh - 48px); box-shadow: var(--shadow-dialog); }
dialog::backdrop { background: #16203b55; }
.dialog-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); max-width: 90vw; border-radius: 12px; background: #252e43; color: white; padding: 14px 22px; z-index: 50; box-shadow: var(--shadow-dialog); }

/* 04. HOME — 확정 시안의 그라데이션 배너·서비스 카드 */
.hero { position: relative; overflow: hidden; isolation: isolate; min-height: 245px; padding: 42px 46px; border-radius: 22px; background: linear-gradient(112deg, #8552ff 0%, #436fff 48%, #319cf7 76%, #57d3d3 100%); color: white; }
.hero::before { content: ''; position: absolute; inset: 0; z-index: -1; background: repeating-linear-gradient(0deg, transparent 0 89px, #ffffff0b 90px 180px), repeating-linear-gradient(90deg, #ffffff05 0 130px, #fff0 130px 260px); }
.hero-art { position: absolute; inset: 0; z-index: -1; overflow: hidden; }
.hero-art::before, .hero-art::after { content: ''; position: absolute; width: 350px; height: 350px; border: 82px solid #ffffff1c; border-radius: 50%; }
.hero-art::before { right: 25%; top: -255px; }
.hero-art::after { right: -48px; bottom: -245px; width: 430px; height: 430px; border-width: 98px; }
.hero h1 { font-size: clamp(26px, 2.6vw, 38px); letter-spacing: -1.2px; }
.hero p { color: #fff; font-size: 16px; margin-top: 10px; }
.hero .hero-button { margin-top: 25px; border-radius: 30px; border: 1.5px solid white; color: white; background: transparent; padding: 10px 21px; min-width: 218px; display: inline-flex; gap: 25px; justify-content: space-between; align-items: center; }
.hero .hero-button:hover { background: #ffffff1a; }
.home-section { margin-top: 34px; }
.service-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.service-card { display: block; position: relative; overflow: hidden; min-height: 211px; padding: 23px; border: 1px solid #dfe3e9; border-radius: var(--radius-card); background: linear-gradient(170deg, white 32%, #f3f8ff 58%, #d7edff 85%, #dcf7fa); transition: transform .18s, border-color .18s; }
.service-card:hover { transform: translateY(-3px); border-color: #83b2f4; }
.service-card h3 { font-size: 24px; letter-spacing: -.8px; }
.service-card p { margin-top: 5px; font-size: 12px; color: #606c7b; max-width: 88%; }
.service-card > .card-arrow { position: absolute; right: 22px; top: 22px; font-size: 25px; font-weight: 300; }
/* CSS 입체 아이콘: 별도 네트워크·압축 라이브러리 없이 구현. 장식용입니다. */
.glass-icon { width: 118px; height: 92px; position: absolute; bottom: 16px; right: 30px; transform: rotate(-9deg) skewY(4deg); border-radius: 17px; background: linear-gradient(135deg, #caeaffdd, #52b9ffcc 38%, #47caff99 80%); border: 2px solid #ffffffc9; box-shadow: inset 3px 3px 10px #fff9, inset -3px -3px 8px #2998ed55, 3px 10px 15px #2c93de24; }
.glass-icon::after { content: ''; position: absolute; border-radius: inherit; inset: 4px; border-top: 1px solid #fff8; }
.glass-icon .head { position: absolute; width: 21px; height: 21px; left: 20px; top: 23px; border-radius: 50%; background: linear-gradient(140deg, white, #dbecff); box-shadow: 2px 3px 3px #2b93da3b; }
.glass-icon .body { position: absolute; width: 36px; height: 22px; border-radius: 22px 22px 5px 5px; background: linear-gradient(140deg, white, #daedff); top: 48px; left: 12px; }
.glass-icon .line { position: absolute; height: 6px; width: 38px; border-radius: 5px; background: #fffffff2; left: 62px; top: 35px; box-shadow: 0 16px 0 #ffffffca; }
.glass-icon.id::before { content: ''; position: absolute; width: 19px; height: 32px; left: 51px; top: -19px; border-radius: 6px; background: linear-gradient(#7cd7ff, #2caff4); border: 1px solid #ffffffa3; }
.glass-icon.documents { width: 82px; height: 100px; right: 43px; }
.glass-icon.documents::before { content: ''; position: absolute; width: 75px; height: 92px; background: linear-gradient(135deg, #9de8ff, #20b0f1b0); border: 1px solid #fff9; border-radius: 16px; top: -8px; left: 19px; z-index: -1; }
.glass-icon.documents .line, .glass-icon.check .line { left: 16px; top: 47px; width: 44px; box-shadow: 0 15px 0 #ffffffe0, 0 30px 0 #ffffffb0; }
.glass-icon.check { width: 89px; height: 104px; }
.glass-icon.check .tick { position: absolute; top: 8px; left: 24px; font-size: 33px; font-weight: 800; color: white; line-height: 1; text-shadow: 2px 3px 3px #348ed977; }
.glass-icon.check .line { top: 56px; }
.home-table th { background: #f0f1f7; }
.home-table th:first-child { border-radius: 10px 0 0 10px; }
.home-table th:last-child { border-radius: 0 10px 10px 0; }

/* 05. BUSINESS VIEWS — 밀도·상태 표현, 실제 계산·권한 로직 없음 */
.person-summary { display: flex; gap: 13px; align-items: center; margin-bottom: 18px; }
.person-avatar { border-radius: 50%; height: 52px; width: 52px; background: linear-gradient(140deg, #ede7ff, #d8f4ff); display: grid; place-items: center; color: #5567bf; font-size: 20px; }
.organizations { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 30px; }
.org-node { background: white; border: 1px solid #d8dff1; border-radius: 12px; padding: 16px 26px; text-align: center; min-width: 160px; }
.org-node.root { color: var(--color-primary); background: #f5f7ff; }
.org-children { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
.file-zone { border: 1px dashed #b9c9e8; border-radius: 14px; padding: 30px; background: #fafbff; margin: 22px 0; }
.file-zone input { background: white; max-width: 450px; }
.result-box { margin-top: 20px; }
.result-box ul { max-height: 260px; overflow: auto; padding-left: 22px; }
.check-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.check-row input { width: auto; min-height: auto; }
.summary-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 24px; }
.summary-cards .panel strong { display: block; font-size: 26px; margin-top: 8px; }
.source-note { color: var(--color-muted); font-size: 12px; margin: 14px 0; }

/* 06. RESPONSIVE — 모바일은 표 가로 스크롤 + 요약, LNB는 drawer */
@media (min-width: 1700px) { .main { max-width: 1650px; margin-right: auto; padding-left: 48px; padding-right: 48px; } .hero { min-height: 265px; } .service-card { min-height: 230px; } }
@media (max-width: 1200px) { :root { --sidebar-width: 200px; } .main { padding: 28px 24px; } .header { padding: 0 24px; } .brand img { width: 180px; } .product-name { font-size: 20px; } .utilities { gap: 8px; } .prototype-tag { display: none; } .split { grid-template-columns: 1fr; } .service-card { padding: 18px; min-height: 205px; } .service-card h3 { font-size: 21px; } .service-card p { max-width: 100%; font-size: 11px; } .glass-icon { transform: scale(.85) rotate(-9deg); transform-origin: bottom right; right: 18px; } }
@media (max-width: 800px) { :root { --header-height: 66px; } .header { padding: 0 14px; gap: 7px; } .brand { gap: 10px; } .brand img { width: 145px; } .brand-divider { height: 20px; } .product-name { font-size: 16px; } .mobile-menu { display: inline-flex; flex-shrink: 0; } .user-label, .utilities [data-action="notifications"] { display: none; } .sidebar { transform: translateX(-100%); transition: transform .18s; width: 224px; } .sidebar.open { transform: translateX(0); } .sidebar-backdrop { position: fixed; inset: var(--header-height) 0 0; background: #17263b44; z-index: 8; } .main { margin-left: 0; padding: 22px 18px; } .hero { padding: 30px 25px; min-height: 235px; } .hero h1 { max-width: 290px; } .hero p { font-size: 13px; max-width: 250px; } .service-grid { grid-template-columns: 1fr; gap: 14px; } .service-card { min-height: 160px; padding: 23px; } .service-card p { max-width: 62%; font-size: 12px; } .glass-icon { right: 35px; bottom: 16px; } .summary-cards { grid-template-columns: 1fr; } .page-heading { align-items: flex-start; } .page-heading .actions { justify-content: flex-end; } h1 { font-size: 26px; } h2 { font-size: 21px; } .section-heading .label { font-size: 10px; margin-left: 6px; } .panel { padding: 18px; } .filters { padding: 16px; } .field { min-width: 120px; flex: 1; } .form-grid { grid-template-columns: 1fr; } .home-section { margin-top: 28px; } .home-table { min-width: 640px; } .notice { font-size: 11px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }

</style>
    <!-- 일반 script + defer: 빌드나 로컬 서버 없이 file:// 실행 가능 -->
</head>

    /* 07. CSV VALIDATION — 목업 전용 계약. 실제 근태·급여 반영 없음 */
    const CSV_HEADERS = ['사번', '귀속월', '근무시간'];
    function renderAttendance() {
        csvCandidate = null;
        main.innerHTML = `${heading('근태 연계', '집계파일의 형식과 예시 데이터를 검증합니다.', '<button class="button" data-action="csv-template">CSV 양식 다운로드</button>')}${notice('목업 전용 형식: 사번,귀속월,근무시간. 티맵 원본·급여 업로드 규격이 아닙니다. 변환·실제 반영은 미구현입니다.')}
            <section class="panel"><h2>근태 집계 데이터 검증</h2><p class="source-note">UTF-8 CSV / 최대 1MB·5,000행 / 예: A10001,2026-11,160</p><div class="file-zone"><label for="csv-file">집계파일 선택</label><input id="csv-file" type="file" accept=".csv,text/csv"><p class="source-note">선택 후 검증 결과를 확인하고 검증 이력을 저장할 수 있습니다.</p></div><div id="csv-results" aria-live="polite"></div></section>
            <section class="panel"><h2>검증 이력</h2><div id="upload-history">${uploadHistory()}</div></section>${footer()}`;

    // 따옴표·쉼표·CRLF·필드 내 줄바꿈을 처리하는 작은 CSV 파서.
    function parseCsv(text) {
        const rows = [];
        let row = [], field = '', quoted = false, closed = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (quoted) {
                if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
                else if (c === '"') { quoted = false; closed = true; }
                else field += c;
            } else if (c === '"') {
                if (field || closed) throw new Error('따옴표 위치가 올바르지 않습니다.');
                quoted = true;
            } else if (c === ',') {
                row.push(field); field = ''; closed = false;
            } else if (c === '\r' || c === '\n') {
                if (c === '\r' && text[i + 1] === '\n') i++;
                row.push(field); rows.push(row); row = []; field = ''; closed = false;
            } else {
                if (closed) throw new Error('닫는 따옴표 뒤에 잘못된 문자가 있습니다.');
                field += c;
            }
        }
        if (quoted) throw new Error('닫히지 않은 따옴표가 있습니다.');
        if (field || row.length || closed) { row.push(field); rows.push(row); }
        return rows.filter(record => record.some(value => value.trim() !== ''));
    }
    function validateCsv(text) {
        const rows = parseCsv(text.replace(/^\uFEFF/, ''));
        if (!rows.length || rows[0].join(',') !== CSV_HEADERS.join(',')) throw new Error('헤더는 사번,귀속월,근무시간 순서여야 합니다.');
        if (rows.length < 2) throw new Error('데이터 행이 없습니다.');
        if (rows.length > 5001) throw new Error('최대 5,000행까지 검증할 수 있습니다.');
        const errors = [], keys = new Set();
        rows.slice(1).forEach((row, index) => {
            const line = index + 2;
            if (row.length !== 3) { errors.push(`${line}행: 열 개수는 3개여야 합니다.`); return; }
            const [id, month, hours] = row.map(value => value.trim());
            if (!state.employees.some(person => person.id === id)) errors.push(`${line}행: 등록된 가상 사번이 아닙니다.`);
            if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)) errors.push(`${line}행: 귀속월은 YYYY-MM 형식이어야 합니다.`);
            if (!/^\d+(\.\d+)?$/.test(hours) || !Number.isFinite(Number(hours))) errors.push(`${line}행: 근무시간은 0 이상의 유한한 숫자여야 합니다.`);
            const key = `${id}|${month}`;
            if (keys.has(key)) errors.push(`${line}행: 사번·귀속월이 중복되었습니다.`);
            keys.add(key);
        });
        return { count: rows.length - 1, errors };
    }
    let fileReadSequence = 0;
    async function inspectCsv(file) {
        const sequence = ++fileReadSequence;
        csvCandidate = null;
        if (!file) return;
        try {
            if (!file.name.toLowerCase().endsWith('.csv')) throw new Error('CSV 파일을 선택해 주세요.');
            if (file.size > 1024 * 1024) throw new Error('파일 크기는 1MB 이하여야 합니다.');
            const report = validateCsv(await file.text());
            if (sequence !== fileReadSequence || !$('#csv-results')) return;
            csvCandidate = { filename: file.name, ...report };
            $('#csv-results').innerHTML = `<div class="result-box">${badge(report.errors.length ? `검증 오류 ${report.errors.length}건` : '검증 통과', report.errors.length ? 'error' : 'success')}<p class="source-note">${report.count}행 검사 · 실제 반영 없음</p>${report.errors.length ? `<ul>${report.errors.slice(0, 100).map(error => `<li>${escapeHtml(error)}</li>`).join('')}</ul>${report.errors.length > 100 ? '<p>오류는 100건까지만 표시합니다.</p>' : ''}` : ''}<button class="button" data-action="save-upload">검증 이력 저장</button></div>`;
        } catch (error) {
            if (sequence === fileReadSequence && $('#csv-results')) $('#csv-results').innerHTML = `<p role="alert">${badge(error.message, 'error')}</p>`;
        }
    }
    function uploadHistory() {
        return table(['파일명', '검증 행', '오류', '검증 시각'], state.uploads.map(row => `<tr><td>${escapeHtml(row.filename)}</td><td>${row.count}</td><td>${row.errors}</td><td>${escapeHtml(row.created)}</td></tr>`), '저장된 검증 이력이 없습니다.');
    }

    function renderPayroll() {
        main.innerHTML = `${heading('급여·정산', '기지급 내역과 정산 검토 자료를 구분합니다.')}${notice('계산·지급·환수·확정·마감 처리는 구현하지 않았습니다. 금액은 고정 예시이며 검토 메모만 저장됩니다.')}${tabs(['급여 결과', '환수·차액'], activePayrollTab, 'payroll')}
            ${activePayrollTab === '급여 결과' ? `<section class="panel"><h2>기지급 결과 · 예시</h2>${table(['대상자', '기지급액', '근거'], SETTLEMENTS.map(row => `<tr><td>${row.name}</td><td class="numeric">${money(row.paid)}원</td><td>시연용 고정 지급내역</td></tr>`))}</section>` : `<div class="filters"><div class="field"><label>귀속월 · 고정 예시</label><input value="2026.11" readonly></div><div class="field"><label for="settlement-type">정산유형</label><select id="settlement-type">${options(['전체', '퇴사월 차액', '기지급 환수'])}</select></div></div><div id="settlement-results"></div>`}${footer()}`;
        if (activePayrollTab === '환수·차액') updateSettlementResults();
    }
    function updateSettlementResults() {
        const type = $('#settlement-type').value;
        $('#settlement-results').innerHTML = table(['대상자', '정산유형', '기지급액', '검토 메모', '검토'], SETTLEMENTS.filter(row => type === '전체' || row.type === type).map(row => `<tr><td>${row.name}</td><td>${row.type}</td><td class="numeric">${money(row.paid)}원</td><td>${badge(state.reviews[row.id] ? '메모 저장됨' : row.status, 'neutral')}</td><td><button class="text-button" data-action="settlement-detail" data-id="${row.id}">검토 내역 보기 →</button></td></tr>`));
    }
    function settlementDialog(id) {
        const row = SETTLEMENTS.find(item => item.id === id);
        if (!row) return;
        openDialog('정산 검토 · 예시', `${definitionList([['대상자', row.name], ['정산유형', row.type], ['기지급액', `${money(row.paid)}원`], ['예시 설명', row.note]])}<p class="source-note">검토 저장은 급여 승인·확정·지급을 의미하지 않습니다.</p><form id="review-form" data-id="${id}"><div class="field"><label for="review-note">검토 메모</label><textarea id="review-note" name="note" required maxlength="1000">${escapeHtml(state.reviews[id] || '')}</textarea></div><div class="actions" style="margin-top:16px"><button class="button primary" type="submit">검토 메모 저장</button><button type="button" class="button" data-action="close">닫기</button></div></form>`);
    }
    function renderRetirement() {
        main.innerHTML = `${heading('퇴직정산', '중도정산 이력과 산입내역의 검토 화면 구성안입니다.')}${notice('퇴직·중도정산 계산식, 산입규칙, 기준일·마감 정책은 확인 전입니다. 계산·실제 반영 버튼은 제공하지 않습니다.')}
            <div class="split"><section class="panel"><h2>정산 검토 대상 · 예시</h2>${table(['사번', '대상자', '자료 상태'], ['<tr><td>A10006</td><td>한지우</td><td>' + badge('자료 확인 필요', 'neutral') + '</td></tr>'])}<p class="source-note">대상자는 가상 퇴직자이며 정산액은 산출하지 않습니다.</p></section>
            <section class="panel"><h3>검토 항목</h3>${definitionList([['중도정산 이력', '서버 조회 계약 확인 필요'], ['산입 항목', '고객 규칙 확인 필요'], ['기지급 내역', '연결 대상 확인 필요']])}<button class="text-button" data-action="retirement-info">확인 범위 보기 →</button></section></div>${footer()}`;
    }
    function renderYearend() {
        main.innerHTML = `${heading('연말정산', '귀속연도·대상·입력자료·결과를 구분하는 화면 구성안입니다.')}${notice('세액·공제 계산과 신고·제출은 미구현입니다. 적용 모듈과 고객 범위 확인 후 연결합니다.')}
            <section class="panel"><div class="section-heading"><h2>자료 확인</h2>${badge('연계 전', 'neutral')}</div>${definitionList([['귀속연도', '2026 · 예시'], ['대상자 조회', '기존 서버 기능 확인 필요'], ['정산자료', '자료 종류·수집 방식 확인 필요'], ['결과 조회', '전문 모듈 연결 계약 확인 필요']])}</section>${footer()}`;
    }

    /* 09. EVALUATION — 저장·제출 잠금은 시연용 UI 상태, 실제 제도 아님 */
    function renderEvaluation() {
        const locked = state.evaluation.status === '제출됨';
        main.innerHTML = `${heading('평가관리', '평가 유형별 메뉴와 입력·저장 상태를 시연합니다.')}${notice('실제 평가단계·배점·공개 범위는 미확정입니다. 아래 의견 저장·제출·잠금은 목업 시연 규칙이며 서버 제출이 아닙니다.')}${tabs(['성과평가', '역량평가', '다면평가', '종합평가'], activeEvaluationTab, 'evaluation')}
            ${activeEvaluationTab !== '성과평가' ? `<section class="panel"><h2>${activeEvaluationTab}</h2><p class="empty">${activeEvaluationTab}의 평가표·평가자·척도·결과 공개 기준은 확인 후 구성합니다.</p></section>` : `<section class="panel"><div class="section-heading"><h2>평가 의견 입력</h2>${badge(state.evaluation.status, locked ? 'success' : 'neutral')}</div><p class="source-note">회차·대상자: 가상 성과평가 / 김하린 · 점수 계산 없음</p><form id="evaluation-form"><div class="field"><label for="evaluation-comment">평가 의견 · 시연용</label><textarea id="evaluation-comment" name="comment" maxlength="2000" ${locked ? 'readonly' : ''}>${escapeHtml(state.evaluation.comment)}</textarea></div><div class="actions" style="margin-top:20px"><button class="button" type="submit" ${locked ? 'disabled' : ''}>임시저장</button><button type="button" class="button primary" data-action="submit-evaluation" ${locked ? 'disabled' : ''}>제출 시연</button>${locked ? '<span class="source-note">제출 상태로 입력이 잠겼습니다. 초기화는 시스템 관리에서 가능합니다.</span>' : ''}</div></form></section>`}${footer()}`;
    }

    /* 10. INTEGRATION / SETTINGS — 실행하지 않는 서버 동작을 명시 */
    function renderIntegration() {
        main.innerHTML = `${heading('연계·이관 관리', '견적 범위와 연결 준비 항목을 확인합니다.')}${notice('API 호출·데이터 이관을 실제 실행하지 않습니다. 아래는 범위 점검용 화면입니다.')}
            <section class="panel"><h2>인사조직정보 API</h2>${definitionList([['대상', '인사·조직정보'], ['제공 방향', '확인 필요'], ['인증·기준일', '확인 필요'], ['조회·오류 계약', '기존 소스 접근 후 확인']])}</section>
            <section class="panel"><h2>초기 데이터 이관</h2>${table(['데이터', '현재 범위', '상세 계약'], ['인사', '조직', '발령', '급여'].map(item => `<tr><td>${item}</td><td>재직자 · 견적 기준</td><td>${badge('기간·이력 깊이·항목 확인 필요', 'neutral')}</td></tr>`))}<p class="source-note">이관 건수·금액 대사와 오류 재처리 방식은 상세 범위 확정 후 설계합니다.</p></section>${footer()}`;
    }
    function renderSettings() {
        main.innerHTML = `${heading('시스템 관리', '시연 데이터와 구현 경계를 확인합니다.')}${notice('화면의 인사담당자는 고정 표시입니다. 로그인·인증·서버 권한 검증 기능은 없습니다.')}
            <section class="panel"><h2>데이터 저장</h2>${definitionList([['저장 위치', '현재 브라우저 localStorage'], ['저장 키', STORAGE_KEY], ['저장 상태', storageAvailable ? '브라우저 저장 사용 가능' : '메모리 모드'], ['데이터', '가상 직원·정산 메모·평가 의견·CSV 검증 이력']])}<div class="actions" style="margin-top:20px"><button class="button danger" data-action="reset-confirm">시연 데이터 초기화</button></div></section>
            <section class="panel"><h2>구현 경계</h2><p class="source-note">실제 개발 소스의 업무 처리·버전은 확인하지 못했습니다. 현재 디자인과 메뉴는 사용자 요구 및 확인 가능한 기능 구조에 따른 제안입니다. 급여·퇴직·세액 계산, 마감·소급, 권한, 실제 저장·API는 미구현입니다.</p></section>${footer()}`;
    }

    /* 11. ROUTING & EVENT DELEGATION — 화면별 중복 리스너 방지 */
    const renderers = { home: renderHome, people: () => renderPeople(false), talent: () => renderPeople(true), organization: renderOrganization, attendance: renderAttendance, payroll: renderPayroll, retirement: renderRetirement, yearend: renderYearend, evaluation: renderEvaluation, integration: renderIntegration, settings: renderSettings };
    function currentRoute() { return location.hash.slice(1).split('?')[0] || 'home'; }
    function setDrawer(open) {
        $('.sidebar').classList.toggle('open', open);
        $('#sidebar-backdrop').hidden = !open;
        $('#menu-toggle').setAttribute('aria-expanded', String(open));
        $('#menu-toggle').setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
    }
    function renderRoute() {
        const route = currentRoute();
        $('#navigation').innerHTML = MENUS.map(menu => `<a href="#${menu.id}" class="nav-link ${menu.id === route ? 'active' : ''} ${menu.id === 'settings' ? 'settings' : ''}" ${menu.id === route ? 'aria-current="page"' : ''}>${icon(menu.icon)}<span>${menu.label}</span></a>`).join('');
        if (renderers[route]) renderers[route]();
        else main.innerHTML = `${heading('화면을 찾을 수 없습니다.')}<a href="#home" class="button primary">홈으로 이동</a>${footer()}`;
        setDrawer(false);
        document.title = `${MENUS.find(menu => menu.id === route)?.label || '화면 없음'} · TMAP U.STRA HR`;
    }
    document.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        const { action, id, group, value } = target.dataset;
        if (action === 'close') closeDialog();
        else if (action === 'scroll-tasks') $('#tasks').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
        else if (action === 'task-info') openDialog('담당 업무 · 예시', '<p>홈에는 고정 업무 예시 3건을 표시합니다. 실제 담당자별 집계·알림·평가 회차와 연결되지 않습니다.</p>');
        else if (action === 'register') registrationDialog();
        else if (action === 'employee-detail') employeeDetail(id);
        else if (action === 'settlement-detail') settlementDialog(id);
        else if (action === 'global-search') { focusPeopleSearch = true; activePeopleTab = '직원 조회'; if (currentRoute() === 'people') renderPeople(); else location.hash = 'people'; }
        else if (action === 'notifications') openDialog('시연 안내', '<p>현재 알림은 서버와 연결되지 않았습니다. 모든 데이터와 상태는 디자인 검토를 위한 예시입니다.</p>');
        else if (action === 'tab') {
            if (group === 'people') { activePeopleTab = value; renderPeople(); }
            else if (group === 'payroll') { activePayrollTab = value; renderPayroll(); }
            else { activeEvaluationTab = value; renderEvaluation(); }
        } else if (action === 'talent-columns') openDialog('조회 컬럼 · 시연', '<p>현재 컬럼: 사번·이름·소속·직급·재직상태·경력 분야.</p><p class="source-note">티맵 확장 컬럼과 개인정보·평가정보 조회 범위는 확인 필요합니다.</p>');
        else if (action === 'org-search') { activePeopleTab = '직원 조회'; pendingPeopleOrg = target.dataset.org; location.hash = 'people'; }
        else if (action === 'movement-info') openDialog('발령 처리 범위', '<p>발령 유형·적용일·취소·소급·겸직과 급여·평가 영향은 기존 서버 기능 및 고객 정책 확인 후 설계합니다. 현재 발령 실행 기능은 없습니다.</p>');
        else if (action === 'retirement-info') openDialog('퇴직정산 확인 범위', '<p>기존 중도정산 이력·기지급 내역·산입규칙의 서버 계약과 고객 정책 확인이 필요합니다. 계산 결과를 임의 생성하지 않습니다.</p>');
        else if (action === 'csv-template') saveFile('attendance-demo.csv', '\uFEFF사번,귀속월,근무시간\r\nA10001,2026-11,160\r\nA10002,2026-11,152\r\n', 'text/csv;charset=utf-8');
        else if (action === 'save-upload' && csvCandidate) {
            state.uploads.unshift({ filename: csvCandidate.filename, count: csvCandidate.count, errors: csvCandidate.errors.length, created: new Date().toLocaleString('ko-KR') });
            state.uploads = state.uploads.slice(0, 30);
            const saved = persist();
            csvCandidate = null;
            target.disabled = true;
            $('#upload-history').innerHTML = uploadHistory();
            if (saved) toast('검증 이력을 저장했습니다. 실제 근태·급여 반영은 없습니다.');
        } else if (action === 'submit-evaluation') {
            const comment = $('#evaluation-comment').value.trim();
            if (!comment) { toast('시연 제출을 위해 의견을 입력해 주세요.'); $('#evaluation-comment').focus(); return; }
            openDialog('평가 제출 시연', `<p>의견을 가상 제출 상태로 저장하고 입력을 잠급니다. 실제 평가 서버에는 제출하지 않습니다.</p><div class="actions" style="margin-top:20px"><button class="button primary" data-action="confirm-evaluation">제출 시연 확인</button><button class="button" data-action="close">취소</button></div>`);
        } else if (action === 'confirm-evaluation') {
            if (state.evaluation.status === '제출됨') return;
            state.evaluation = { status: '제출됨', comment: $('#evaluation-comment').value.trim() };
            const saved = persist(); closeDialog(); renderEvaluation();
            if (saved) toast('목업 제출 상태로 저장했습니다.');
        } else if (action === 'reset-confirm') openDialog('시연 데이터 초기화', '<p>이 목업에서 등록한 가상 직원·검토 메모·평가·CSV 이력을 지우고 기본 예시로 돌아갑니다. 다른 저장 키는 변경하지 않습니다.</p><div class="actions" style="margin-top:20px"><button class="button danger" data-action="reset-data">초기화 실행</button><button class="button" data-action="close">취소</button></div>');
        else if (action === 'reset-data') {
            try { localStorage.removeItem(STORAGE_KEY); storageAvailable = true; }
            catch { storageAvailable = false; }
            state = initialState(); closeDialog(); renderRoute();
            toast(storageAvailable ? '시연 데이터를 초기화했습니다.' : '메모리만 초기화했습니다. 브라우저 저장 데이터 삭제는 실패했습니다.');
        }
    });
    document.addEventListener('submit', event => {
        const form = event.target;
        event.preventDefault();
        if (form.getAttribute('id') === 'people-search') updatePeopleResults(currentRoute() === 'talent', activePeopleTab !== '직원 조회' && currentRoute() === 'people');
        else if (form.getAttribute('id') === 'employee-form') {
            const data = Object.fromEntries(new FormData(form));
            for (const key of Object.keys(data)) data[key] = data[key].trim();
            if (!data.id || !data.name) { $('#register-error').textContent = '사번과 이름을 입력해 주세요.'; return; }
            if (state.employees.some(p => p.id.toLowerCase() === data.id.toLowerCase())) { $('#register-error').textContent = '이미 등록된 사번입니다.'; return; }
            state.employees.push({ ...data, status: '재직', family: '없음', support: '없음', supportAmount: 0 });
            const saved = persist(); closeDialog(); renderPeople();
            if (saved) toast('가상 직원을 저장했습니다.');
        } else if (form.getAttribute('id') === 'review-form') {
            const note = new FormData(form).get('note').trim();
            if (!note) return;
            state.reviews[form.dataset.id] = note;
            const saved = persist(); closeDialog(); renderPayroll();
            if (saved) toast('검토 메모를 저장했습니다.');
        } else if (form.getAttribute('id') === 'evaluation-form' && state.evaluation.status !== '제출됨') {
            state.evaluation = { status: '임시저장', comment: new FormData(form).get('comment').trim() };
            const saved = persist(); renderEvaluation();
            if (saved) toast('평가 의견을 임시저장했습니다.');
        }
    });
    document.addEventListener('reset', event => {
        if (event.target.id === 'people-search') setTimeout(() => updatePeopleResults(currentRoute() === 'talent', activePeopleTab !== '직원 조회' && currentRoute() === 'people'), 0);
    });
    document.addEventListener('change', event => {
        if (event.target.id === 'csv-file') inspectCsv(event.target.files[0]);
        if (event.target.id === 'settlement-type') updateSettlementResults();
    });
    // 본문 바로가기는 해시 라우터를 변경하지 않고 포커스만 이동합니다.
    $('.skip-link').addEventListener('click', event => { event.preventDefault(); main.focus(); main.scrollIntoView(); });
    $('#close-dialog').addEventListener('click', closeDialog);
    $('#menu-toggle').addEventListener('click', () => setDrawer(!$('.sidebar').classList.contains('open')));
    $('#sidebar-backdrop').addEventListener('click', () => setDrawer(false));
    document.addEventListener('keydown', event => { if (event.key === 'Escape') setDrawer(false); });
    window.addEventListener('hashchange', () => { renderRoute(); main.focus({ preventScroll: true }); window.scrollTo(0, 0); });
    $('[data-action="global-search"]').innerHTML = icon('search');
    $('[data-action="notifications"]').innerHTML = icon('bell');
    renderRoute();
    if (loadWarning) toast(loadWarning);
})();

</script>
</body>
</html>
